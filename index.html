<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paratrooper</title>
<style>
	html,body{margin:0;height:100%;overflow:hidden;background:#f7f7f4;font-family:Arial,Helvetica,sans-serif;color:#2e2e2e}
	canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
	#hud{position:fixed;left:14px;top:12px;display:flex;gap:18px;align-items:center;background:rgba(255,255,255,.82);border:2px solid #333;padding:8px 12px;border-radius:10px;user-select:none}
	#hud span{min-width:92px}
	button{font:inherit;border:2px solid #333;border-radius:7px;background:white;padding:6px 10px;cursor:pointer}
	button:hover{background:#eee}
	#help{position:fixed;right:14px;top:14px;background:rgba(255,255,255,.82);border:2px solid #333;border-radius:10px;padding:8px 12px;user-select:none}
	dialog{border:2px solid #333;border-radius:12px;padding:18px;max-width:440px}
	dialog::backdrop{background:rgba(0,0,0,.28)}
	label{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;margin:10px 0}
	input[type=range]{grid-column:1/3;width:100%}
	.row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
	.small{font-size:13px;color:#555}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
	<span>Score: <b id="score">0</b></span>
	<span>Level: <b id="level">1</b></span>
	<span>Turret: <b id="health">100</b>%</span>
	<button id="pauseBtn">Pause</button>
	<button id="settingsBtn">Settings</button>
	<button id="restartBtn">Restart</button>
</div>
<div id="help">Aim with mouse · Hold right mouse button or Space to fire</div>

<dialog id="settings">
	<h2>Game settings</h2>
	<label>Fire interval (ms) <output id="fireOut"></output><input id="fire" type="range" min="45" max="350" step="5"></label>
	<label>Base drop interval (ms) <output id="dropOut"></output><input id="drop" type="range" min="350" max="2600" step="50"></label>
	<label>Starting planes <output id="planesOut"></output><input id="planes" type="range" min="1" max="8" step="1"></label>
	<label>Plane hit points <output id="hpOut"></output><input id="hp" type="range" min="1" max="20" step="1"></label>
	<label>UFO hit points <output id="ufoHpOut"></output><input id="ufoHp" type="range" min="1" max="20" step="1"></label>
	<label>Pyramid size <output id="pyrOut"></output><input id="pyr" type="range" min="4" max="14" step="1"></label>
	<label>Difficulty growth <output id="diffOut"></output><input id="diff" type="range" min="0" max="2" step=".1"></label>
	<div class="small">Changes take effect immediately. Difficulty increases plane speed, active plane count, and paratrooper drop frequency over time.</div>
	<div class="row"><button id="closeSettings">Close</button></div>
</dialog>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");
const healthEl = document.getElementById("health");
const settings = document.getElementById("settings");

let W=0,H=0,groundY=0,dpr=1;
let mouse={x:0,y:0}, firing=false, spaceHeld=false, rightHeld=false;
let score=0, elapsed=0, gameOver=false, paused=false, turretHealth=100, lastFire=0;
let planes=[], ufos=[], dinosaurs=[], bullets=[], enemyBullets=[], troopers=[], particles=[], splatterParticles=[], explosions=[], colorExplosions=[], splats=[], trees=[];
let planeSpawnTimer=0, ufoSpawnTimer=18, dinosaurSpawnTimer=30, nextPlaneId=1;

const cfg={
	fireInterval:110,
	dropInterval:1250,
	startPlanes:2,
	planeHP:4,
	ufoHP:6,
	pyramidSize:7,
	difficulty:1
};

function resize(){
	dpr=Math.min(devicePixelRatio||1,2);
	W=innerWidth; H=innerHeight; groundY=H-72;
	canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
	ctx.setTransform(dpr,0,0,dpr,0,0);
	if(!trees.length)makeTrees();
}
addEventListener("resize",resize); resize();

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy}
function makeTrees(){
	trees=[];
	const n=Math.max(7,Math.floor(W/150));
	for(let i=0;i<n;i++){
		let x=rand(35,W-35);
		if(Math.abs(x-W/2)<95){x+=x<W/2?-100:100;}
		x=clamp(x,35,W-35);
		trees.push({x,h:rand(36,72),w:rand(22,38)});
	}
}
function emitFlame(x,y,vx=0,vy=0){
	for(let i=0;i<3;i++){
		particles.push({
			x:x+rand(-5,5),
			y:y+rand(-4,4),
			vx:vx+rand(-28,28),
			vy:vy+rand(-25,15),
			t:rand(.28,.55),
			hot:true,
			flame:true
		});
	}
}

class Plane{
	constructor(dir){
		this.dir=dir|| (Math.random()<.5?1:-1);
		this.x=this.dir>0?-110:W+110;
		this.y=rand(70,Math.max(130,H*.34));
		this.speed=rand(70,105);
		this.hp=cfg.planeHP;
		this.dropT=rand(150,cfg.dropInterval);
		this.dead=false;
		this.vy=0; this.rot=0; this.id=nextPlaneId++;
	}
	update(dt,diff){
		if(this.dead){
			this.vy+=190*dt;
			this.y+=this.vy*dt;
			this.x+=this.dir*this.speed*.55*dt;
			this.rot+=this.dir*1.8*dt;
			emitFlame(this.x-this.dir*34,this.y,-this.dir*35,-25);
			if(this.y>groundY-15){
				colorExplosion(this.x,this.y,46);
				explosion(this.x,this.y,34);
				this.remove=true;
			}
			return;
		}
		this.x+=this.dir*this.speed*diff*dt;
		this.dropT-=dt*1000*diff;
		if(this.dropT<=0 && this.x>80 && this.x<W-80){
			troopers.push(new Trooper(this.x,this.y+18));
			this.dropT=rand(cfg.dropInterval*.75,cfg.dropInterval*1.25);
		}
		if(this.dir>0 && this.x>W+130 || this.dir<0 && this.x<-130) this.remove=true;
	}
	draw(){
		ctx.save();
		ctx.translate(this.x,this.y);
		ctx.rotate(this.rot);
		ctx.scale(-this.dir,1);

		ctx.lineWidth=3;
		ctx.strokeStyle="#353535";
		ctx.fillStyle=this.dead?"#8f8583":"#b7aaa7";

		// Main fuselage with a rounded nose and tapered tail.
		ctx.beginPath();
		ctx.moveTo(-58,-8);
		ctx.quadraticCurveTo(-68,0,-58,8);
		ctx.lineTo(34,8);
		ctx.quadraticCurveTo(51,7,59,0);
		ctx.quadraticCurveTo(51,-7,34,-8);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		// Main wing.
		ctx.beginPath();
		ctx.moveTo(-8,-4);
		ctx.lineTo(17,-29);
		ctx.lineTo(32,-29);
		ctx.lineTo(18,-3);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		ctx.beginPath();
		ctx.moveTo(-8,4);
		ctx.lineTo(17,29);
		ctx.lineTo(32,29);
		ctx.lineTo(18,3);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		// Tailplane and vertical stabilizer.
		ctx.beginPath();
		ctx.moveTo(33,-5);
		ctx.lineTo(47,-22);
		ctx.lineTo(55,-22);
		ctx.lineTo(51,-4);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		ctx.beginPath();
		ctx.moveTo(35,4);
		ctx.lineTo(50,16);
		ctx.lineTo(56,16);
		ctx.lineTo(50,3);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		// Cockpit window and nose detail.
		ctx.fillStyle="#eef3f3";
		ctx.beginPath();
		ctx.ellipse(-35,-2,10,4,0,0,Math.PI*2);
		ctx.fill();
		ctx.stroke();

		ctx.fillStyle="#353535";
		ctx.beginPath();
		ctx.arc(-53,0,2.5,0,Math.PI*2);
		ctx.fill();

		ctx.restore();
	}
}

class UFO{
	constructor(){
		this.x=Math.random()<.5?-80:W+80;
		this.baseY=rand(90,Math.max(150,H*.32));
		this.y=this.baseY;
		this.dir=this.x<0?1:-1;
		this.speed=rand(220,270);
		this.age=0;
		this.hp=cfg.ufoHP;
		this.phase=rand(0,Math.PI*2);
		this.dead=false;
		this.vy=0;
		this.rot=0;
		this.target=null;
		this.abducting=false;
		this.abductedTrooper=null;
		this.abductedDinosaur=null;
		this.targetType=null;
		this.abductCooldown=0;
	}
	update(dt){
		this.age+=dt;

		if(this.dead){
			this.vy+=150*dt;
			this.y+=this.vy*dt;
			this.x+=this.dir*this.speed*.25*dt;
			this.rot+=this.dir*2.4*dt;
			emitFlame(this.x,this.y+8,-this.dir*20,-15);
			if(this.abductedTrooper && !this.abductedTrooper.remove){
				this.abductedTrooper.x=this.x;
				this.abductedTrooper.y=this.y+30;
			}
			if(this.y>groundY-10){
				colorExplosion(this.x,this.y,55);
				explosion(this.x,this.y,38);
				this.remove=true;
			}
			return;
		}

		this.abductCooldown-=dt;

		// Drop invalid targets and immediately look for another one.
		if(this.target){
			if(this.targetType==="trooper"){
				if(this.target.remove || this.target.dead || ["fall","deadfall","runner","plant","fuse","eaten"].includes(this.target.state)){
					this.target=null;
					this.targetType=null;
					this.abducting=false;
				}
			}else if(this.targetType==="dinosaur"){
				if(this.target.remove || this.target.dead || this.target.victim || this.target.ate){
					this.target=null;
					this.targetType=null;
					this.abducting=false;
				}
			}
		}

		// Weighted target choice:
		// ground paratrooper = 6
		// airborne paratrooper = 3
		// dinosaur = 2.5
		// Thus ground troops are preferred, airborne troops are less likely,
		// and dinosaurs are possible but less likely than either paratrooper category.
		if(!this.target && !this.abductedTrooper && !this.abductedDinosaur){
			const groundTroopers=troopers.filter(t=>!t.remove && !t.dead && ["walk","stack"].includes(t.state));
			const airTroopers=troopers.filter(t=>!t.remove && !t.dead && ["jump","chute"].includes(t.state));
			const dinosaurCandidates=dinosaurs.filter(d=>!d.remove && !d.dead && !d.abducted && !d.victim);

			const groups=[];
			if(groundTroopers.length)groups.push({kind:"ground",weight:6,candidates:groundTroopers});
			if(airTroopers.length)groups.push({kind:"air",weight:3,candidates:airTroopers});
			if(dinosaurCandidates.length)groups.push({kind:"dinosaur",weight:2.5,candidates:dinosaurCandidates});

			if(groups.length){
				const total=groups.reduce((sum,g)=>sum+g.weight,0);
				let pick=Math.random()*total;
				let chosen=groups[groups.length-1];
				for(const g of groups){
					pick-=g.weight;
					if(pick<=0){chosen=g;break;}
				}

				chosen.candidates.sort((a,b)=>dist2(this.x,this.y,a.x,a.y)-dist2(this.x,this.y,b.x,b.y));
				this.target=chosen.candidates[0];
				this.targetType=chosen.kind==="dinosaur"?"dinosaur":"trooper";
				this.abducting=false;
			}
		}

		if(this.target){
			const isDino=this.targetType==="dinosaur";
			const alreadyLifting=isDino?this.target.abducted:this.target.state==="abducted";

			if(!alreadyLifting){
				// Stage 1: fly to a stable hover point above the selected target.
				const hoverX=this.target.x;
				const hoverY=Math.max(70,this.target.y-(isDino?105:85));
				const dx=hoverX-this.x;
				const dy=hoverY-this.y;
				const mag=Math.max(1,Math.hypot(dx,dy));
				const pursuitSpeed=isDino?250:320;
				const desiredVX=dx/mag*pursuitSpeed;
				const desiredVY=dy/mag*pursuitSpeed;

				this.seekVX=(this.seekVX||0)+(desiredVX-(this.seekVX||0))*Math.min(1,dt*(isDino?3.8:5.5));
				this.seekVY=(this.seekVY||0)+(desiredVY-(this.seekVY||0))*Math.min(1,dt*(isDino?3.8:5.5));
				this.x+=this.seekVX*dt;
				this.y+=this.seekVY*dt;

				if(Math.abs(dx)<40 && Math.abs(dy)<34){
					this.abducting=true;
					this.seekVX*=.2;
					this.seekVY*=.2;

					if(isDino){
						this.target.abducted=true;
						this.target.target=null;
					}else{
						this.target.chute=false;
						this.target.state="abducted";
						this.target.vx=0;
						this.target.vy=0;
					}
				}
			}else{
				// Stage 2: hold the UFO nearly stationary and pull the target into the beam.
				this.abducting=true;
				this.seekVX=(this.seekVX||0)*Math.pow(.08,dt);
				this.seekVY=(this.seekVY||0)*Math.pow(.08,dt);
				this.x+=this.seekVX*dt;
				this.y+=this.seekVY*dt;

				if(isDino){
					const liftPulse=Math.sin(this.age*18);
					const liftRate=liftPulse>-.1?34:8;
					this.target.x+=(this.x-this.target.x)*Math.min(1,dt*2.4);
					this.target.y-=liftRate*dt;

					if(this.target.y<=this.y+46){
						this.abductedDinosaur=this.target;
						this.abductedDinosaur.x=this.x;
						this.abductedDinosaur.y=this.y+48;
						this.target=null;
						this.targetType=null;
						this.abducting=false;
						this.fleeDir=this.x<W/2?-1:1;
					}
				}else{
					this.target.x+=(this.x-this.target.x)*Math.min(1,dt*6);
					this.target.y-=155*dt;

					if(this.target.y<=this.y+22){
						this.abductedTrooper=this.target;
						this.abductedTrooper.x=this.x;
						this.abductedTrooper.y=this.y+30;
						this.target=null;
						this.targetType=null;
						this.abducting=false;
						this.fleeDir=this.x<W/2?-1:1;
						this.abductCooldown=0;
					}
				}
			}		}else if(this.abductedDinosaur && !this.abductedDinosaur.remove){
			const escapeDir=this.fleeDir||this.dir;
			const stutter=Math.sin(this.age*16)>0.15?1:.18;
			this.x+=escapeDir*115*stutter*dt;
			this.y-=22*stutter*dt;
			this.y+=Math.sin(this.age*11)*8*dt;
			this.abductedDinosaur.x=this.x;
			this.abductedDinosaur.y=this.y+48;
			if((escapeDir>0 && this.x>W+120)||(escapeDir<0 && this.x<-120)||this.y<-90){
				this.abductedDinosaur.remove=true;
				this.abductedDinosaur=null;
				this.remove=true;
			}
		}else if(this.abductedTrooper && !this.abductedTrooper.remove){
			const escapeDir=this.fleeDir||this.dir;
			this.x+=escapeDir*360*dt;
			this.y+=Math.sin(this.age*2.3+this.phase)*38*dt;
			this.abductedTrooper.x=this.x;
			this.abductedTrooper.y=this.y+30;
			if((escapeDir>0 && this.x>W+100)||(escapeDir<0 && this.x<-100)){
				this.abductedTrooper.remove=true;
				this.abductedTrooper=null;
				this.remove=true;
			}
		}else{
			// Patrol rapidly while continuously looking for a target.
			this.seekVX=(this.seekVX||this.dir*this.speed);
			this.seekVY=(this.seekVY||0);
			const desiredVX=this.dir*this.speed;
			const desiredVY=Math.sin(this.age*2.2+this.phase)*65;
			this.seekVX+=(desiredVX-this.seekVX)*Math.min(1,dt*3.5);
			this.seekVY+=(desiredVY-this.seekVY)*Math.min(1,dt*3.5);
			this.x+=this.seekVX*dt;
			this.y+=this.seekVY*dt;
			this.y=clamp(this.y,65,Math.max(120,groundY-140));
			if(this.x<55){this.x=55;this.dir=1;this.seekVX=Math.abs(this.seekVX);}
			if(this.x>W-55){this.x=W-55;this.dir=-1;this.seekVX=-Math.abs(this.seekVX);}
		}
	}
	draw(){
		ctx.save();
		ctx.translate(this.x,this.y);
		ctx.rotate(this.rot);

		if(this.abducting && this.target){
			ctx.fillStyle="rgba(160,255,210,.18)";
			ctx.strokeStyle="rgba(90,210,150,.65)";
			ctx.lineWidth=2;
			ctx.beginPath();
			ctx.moveTo(-18,10);
			const beamHalf=this.targetType==="dinosaur"?28:12;
			ctx.lineTo(this.target.x-this.x-beamHalf,this.target.y-this.y);
			ctx.lineTo(this.target.x-this.x+beamHalf,this.target.y-this.y);
			ctx.lineTo(18,10);
			ctx.closePath();
			ctx.fill();
			ctx.stroke();
		}

		ctx.lineWidth=3;
		ctx.strokeStyle="#353535";
		ctx.fillStyle=this.dead?"#777":"#aaa";
		ctx.beginPath();
		ctx.ellipse(0,5,34,11,0,0,Math.PI*2);
		ctx.fill();ctx.stroke();

		ctx.fillStyle="#d7d7d2";
		ctx.beginPath();
		ctx.arc(0,0,15,Math.PI,0);
		ctx.closePath();
		ctx.fill();ctx.stroke();

		ctx.fillStyle="#353535";
		for(const lx of [-18,0,18]){
			ctx.beginPath();
			ctx.arc(lx,8,2.5,0,Math.PI*2);
			ctx.fill();
		}
		ctx.restore();
	}
}

class Dinosaur{
	constructor(){
		this.dir=Math.random()<.5?1:-1;
		this.x=this.dir>0?-85:W+85;
		this.y=groundY-20;
		this.speed=rand(72,92);
		this.hp=10;
		this.dead=false;
		this.remove=false;
		this.target=null;
		this.victim=null;
		this.roamTarget=rand(70,W-70);
		this.age=0;
		this.ate=false;
		this.exiting=false;
		this.abducted=false;
		this.chewTimer=0;
	}
	update(dt){
		this.age+=dt;
		if(this.dead){
			this.y+=90*dt;
			if(this.age>1.1)this.remove=true;
			return;
		}
		if(this.abducted){
			return;
		}

		if(this.victim){
			this.chewTimer+=dt;
			this.victim.state="eaten";
			this.victim.chute=false;
			this.victim.x=this.x+this.dir*39+Math.sin(this.chewTimer*24)*3;
			this.victim.y=this.y-25+Math.cos(this.chewTimer*22)*2;
			this.victim.eatenScale=Math.max(.12,1-this.chewTimer*.72);

			if(Math.random()<dt*14){
				splatterParticles.push({
					x:this.x+this.dir*40,
					y:this.y-22,
					vx:rand(-45,45),
					vy:rand(-80,-20),
					r:rand(1.2,2.6),
					t:rand(.25,.55),
					red:true
				});
			}

			if(this.chewTimer>1.25){
				this.victim.remove=true;
				this.victim=null;
				this.ate=true;
				this.exiting=true;
				this.dir=this.x<W/2?-1:1;
				this.roamTarget=this.dir>0?W+140:-140;
				this.speed=rand(112,132);
			}
			return;
		}

		const candidates=this.exiting?[]:troopers.filter(t=>!t.remove && !t.dead && ["walk","stack"].includes(t.state));
		if(candidates.length){
			candidates.sort((a,b)=>Math.abs(a.x-this.x)-Math.abs(b.x-this.x));
			this.target=candidates[0];
		}else{
			this.target=null;
		}

		let tx=this.target?this.target.x:this.roamTarget;
		if(this.exiting)tx=this.roamTarget;
		if(!this.target && !this.exiting && Math.abs(tx-this.x)<18){
			this.roamTarget=rand(70,W-70);
			tx=this.roamTarget;
		}

		const dx=tx-this.x;
		this.dir=Math.sign(dx)||this.dir;
		this.x+=this.dir*this.speed*dt;
		this.y=groundY-20+Math.sin(this.age*9)*1.5;

		if(this.target && Math.abs(dx)<28){
			this.victim=this.target;
			this.target=null;
			this.chewTimer=0;
		}

		if(this.ate && (this.x<-120 || this.x>W+120))this.remove=true;
	}
	draw(){
		ctx.save();
		ctx.translate(this.x,this.y);
		ctx.scale(this.dir,1);
		ctx.lineWidth=3;
		ctx.strokeStyle="#21351d";
		ctx.fillStyle=this.dead?"#777463":"#618f3d";

		// Long tail.
		ctx.beginPath();
		ctx.moveTo(-22,-17);
		ctx.quadraticCurveTo(-52,-28,-72,-12);
		ctx.quadraticCurveTo(-48,-13,-24,-5);
		ctx.closePath();
		ctx.fill();ctx.stroke();

		// Muscular body.
		ctx.beginPath();
		ctx.ellipse(-2,-18,31,19,-.08,0,Math.PI*2);
		ctx.fill();ctx.stroke();

		// Neck and large head.
		ctx.beginPath();
		ctx.moveTo(17,-29);
		ctx.quadraticCurveTo(26,-40,37,-38);
		ctx.lineTo(52,-34);
		ctx.quadraticCurveTo(61,-29,56,-21);
		ctx.lineTo(43,-16);
		ctx.lineTo(23,-10);
		ctx.closePath();
		ctx.fill();ctx.stroke();

		// Jaw with visible mouth.
		const jaw=Math.sin(this.age*16)*2+(this.victim?5:0);
		ctx.fillStyle="#456f31";
		ctx.beginPath();
		ctx.moveTo(34,-21);
		ctx.lineTo(58,-20+jaw);
		ctx.lineTo(47,-11+jaw);
		ctx.lineTo(29,-13);
		ctx.closePath();
		ctx.fill();ctx.stroke();

		ctx.fillStyle="#7d1f1f";
		ctx.beginPath();
		ctx.moveTo(37,-19);
		ctx.lineTo(54,-18+jaw);
		ctx.lineTo(45,-14+jaw);
		ctx.closePath();
		ctx.fill();

		// Teeth.
		ctx.fillStyle="#f4f0dc";
		for(let i=0;i<4;i++){
			const tx=39+i*4;
			ctx.beginPath();
			ctx.moveTo(tx,-19);
			ctx.lineTo(tx+2,-14+jaw);
			ctx.lineTo(tx+4,-19);
			ctx.closePath();
			ctx.fill();
		}

		// Alternating hind-leg stride.
		const stride=this.abducted?0:Math.sin(this.age*10)*9;
		ctx.strokeStyle="#21351d";
		ctx.lineWidth=6;
		ctx.beginPath();
		ctx.moveTo(-10,-4);ctx.lineTo(-15+stride*.35,10);ctx.lineTo(-27+stride,18);
		ctx.moveTo(12,-5);ctx.lineTo(17-stride*.35,10);ctx.lineTo(29-stride,18);
		ctx.stroke();

		// Feet.
		ctx.lineWidth=3;
		ctx.beginPath();
		ctx.moveTo(-27+stride,18);ctx.lineTo(-33+stride,18);
		ctx.moveTo(29-stride,18);ctx.lineTo(35-stride,18);
		ctx.stroke();

		// Small forearms.
		ctx.lineWidth=3;
		ctx.beginPath();
		ctx.moveTo(20,-17);ctx.lineTo(30,-10);ctx.lineTo(35,-12);
		ctx.moveTo(18,-20);ctx.lineTo(27,-14);ctx.lineTo(31,-16);
		ctx.stroke();

		// Eye.
		ctx.fillStyle="#f3c23c";
		ctx.beginPath();ctx.arc(43,-31,3.3,0,Math.PI*2);ctx.fill();
		ctx.fillStyle="#111";
		ctx.beginPath();ctx.arc(44,-31,1.4,0,Math.PI*2);ctx.fill();

		ctx.restore();
	}
}

class Trooper{
	constructor(x,y){
		this.x=x; this.y=y; this.vx=rand(-12,12); this.vy=20; this.state="jump"; this.t=0;
		this.chute=false; this.dead=false; this.targetX=W/2; this.walkDir=0; this.stackIndex=-1; this.wave=0;
	}
	update(dt){
		this.t+=dt; this.wave+=dt*(this.state==="fall"?22:10);
		if(this.state==="jump"){
			this.vy+=170*dt; this.x+=this.vx*dt; this.y+=this.vy*dt;
			if(this.t>.6){this.state="chute";this.chute=true;this.vy=54;}
		}else if(this.state==="chute"){
			this.x+=this.vx*.12*dt; this.y+=this.vy*dt;
			if(this.y>groundY-20){ this.y=groundY-20; this.chute=false; this.state="walk"; this.t=0; }
		}else if(this.state==="fall"){
			this.vy+=420*dt; this.x+=this.vx*dt; this.y+=this.vy*dt;
			if(this.y>groundY-8){ this.y=groundY-8; makeSplat(this.x); this.remove=true; score+=20; }
		}else if(this.state==="deadfall"){
			this.vy+=470*dt; this.x+=this.vx*dt; this.y+=this.vy*dt;
			if(this.y>groundY-8){ this.y=groundY-8; makeSplat(this.x); this.remove=true; }
		}else if(this.state==="abducted"){
			this.wave+=dt*18;
		}else if(this.state==="eaten"){
			this.wave+=dt*28;
		}else if(this.state==="walk"){
			const tx=W/2 + (this.x<W/2?-72:72);
			const dx=tx-this.x;
			this.walkDir=Math.sign(dx)||1;
			this.x+=this.walkDir*35*dt;
			if(Math.abs(dx)<5){this.state="stack";this.t=0;}
		}else if(this.state==="stack"){
			// position is handled in pyramid layout
		}else if(this.state==="runner"){
			const tx=W/2;
			const dx=tx-this.x;
			this.walkDir=Math.sign(dx)||1;
			this.x+=this.walkDir*62*dt;
			this.y-=Math.min(20,Math.abs(dx)*.03)*dt;
			if(Math.abs(dx)<18){this.state="plant";this.t=0;}
		}else if(this.state==="plant"){
			if(this.t>1.0){this.state="fuse";this.t=0;}
		}else if(this.state==="fuse"){
			if(this.t>2.0){ explodeTurret(); }
		}
	}
	draw(){
		ctx.save(); ctx.translate(this.x,this.y);
		if(this.state==="eaten"){
			ctx.rotate(Math.sin(this.wave)*.35);
			const s=this.eatenScale||1;
			ctx.scale(s,s);
		}
		if(this.chute){
			ctx.lineWidth=2.2; ctx.strokeStyle="#333"; ctx.fillStyle="#c7bdbb";
			ctx.beginPath(); ctx.arc(0,-25,17,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
			ctx.beginPath(); ctx.moveTo(-17,-25);ctx.lineTo(0,-8);ctx.moveTo(17,-25);ctx.lineTo(0,-8);ctx.moveTo(0,-42);ctx.lineTo(0,-8);ctx.stroke();
		}
		drawPerson(0,0,this.state==="fall"||this.state==="abducted"||this.state==="eaten",this.wave,this.state==="deadfall");
		if(this.state==="fuse"){
			ctx.fillStyle="#333";ctx.fillRect(-4,5,9,8);
			ctx.strokeStyle="#d33";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(4,6);ctx.quadraticCurveTo(10,1,8,-4);ctx.stroke();
		}
		ctx.restore();
	}
}

function drawPerson(x,y,fall,wave,dead=false){
	ctx.save();ctx.translate(x,y);
	ctx.strokeStyle="#087f75";ctx.fillStyle="#087f75";ctx.lineWidth=3;ctx.lineCap="round";
	ctx.beginPath();ctx.arc(0,-8,3.2,0,Math.PI*2);ctx.fill();
	ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,8);
	if(dead){
		ctx.moveTo(0,0);ctx.lineTo(-7,6);
		ctx.moveTo(0,0);ctx.lineTo(6,7);
		ctx.moveTo(0,8);ctx.lineTo(-5,14);
		ctx.moveTo(0,8);ctx.lineTo(4,15);
	}else if(fall){
		const a=Math.sin(wave);
		const b=Math.cos(wave*1.31);
		ctx.moveTo(0,0);ctx.lineTo(-9,-5+8*a);
		ctx.moveTo(0,0);ctx.lineTo(9,4-8*b);
		ctx.moveTo(0,8);ctx.lineTo(-7,14+6*b);
		ctx.moveTo(0,8);ctx.lineTo(7,14-6*a);
	}else{
		ctx.moveTo(0,0);ctx.lineTo(-6,5);ctx.moveTo(0,0);ctx.lineTo(6,4);
		ctx.moveTo(0,8);ctx.lineTo(-4,15);ctx.moveTo(0,8);ctx.lineTo(5,15);
	}
	ctx.stroke();ctx.restore();
}

function drawTurret(){
	const x=W/2,y=groundY;
	ctx.lineWidth=3;ctx.strokeStyle="#333";ctx.fillStyle="#b5aaa6";
	ctx.fillRect(x-34,y-34,68,34);ctx.strokeRect(x-34,y-34,68,34);
	ctx.beginPath();ctx.arc(x,y-34,20,Math.PI,0);ctx.fill();ctx.stroke();
	const ang=Math.atan2(mouse.y-(y-42),mouse.x-x);
	ctx.save();ctx.translate(x,y-42);ctx.rotate(ang);ctx.fillStyle="#b5aaa6";ctx.strokeStyle="#333";ctx.fillRect(4,-4,38,8);ctx.strokeRect(4,-4,38,8);ctx.restore();
}

function shoot(now){
	if(gameOver || now-lastFire<cfg.fireInterval) return;
	lastFire=now;
	const ox=W/2,oy=groundY-42;
	const ang=Math.atan2(mouse.y-oy,mouse.x-ox);
	const speed=760;
	bullets.push({x:ox+Math.cos(ang)*30,y:oy+Math.sin(ang)*30,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,r:3});
}

function updateBullets(dt){
	for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
	for(const b of bullets){
		if(b.hit) continue;
		for(const u of ufos){
			if(u.dead) continue;
			if(dist2(b.x,b.y,u.x,u.y)<38*38){
				b.hit=true;u.hp--;score+=8;spark(b.x,b.y);
				if(u.hp<=0){
					u.dead=true;
					u.vy=20;
					if(u.target && u.target.state==="abducted"){
						u.target.state="fall";
						u.target.vy=25;
						u.target.vx=rand(-20,20);
						u.target.chute=false;
					}
					if(u.abductedTrooper && !u.abductedTrooper.remove){
						u.abductedTrooper.state="fall";
						u.abductedTrooper.vy=25;
						u.abductedTrooper.vx=rand(-20,20);
						u.abductedTrooper.chute=false;
						u.abductedTrooper=null;
					}
					if(u.target && u.targetType==="dinosaur" && !u.target.remove){
						u.target.abducted=false;
						u.target.y=Math.min(u.target.y,groundY-20);
					}
					if(u.abductedDinosaur && !u.abductedDinosaur.remove){
						u.abductedDinosaur.abducted=false;
						u.abductedDinosaur.y=Math.min(u.abductedDinosaur.y,groundY-20);
						u.abductedDinosaur=null;
					}
					u.target=null;
					u.targetType=null;
					u.abducting=false;
					score+=175;
					colorExplosion(u.x,u.y,32);
				}
				break;
			}
		}
		if(b.hit) continue;
		for(const d of dinosaurs){
			if(d.dead) continue;
			if(Math.abs(b.x-d.x)<42 && Math.abs(b.y-d.y)<24){
				b.hit=true;
				d.hp--;
				score+=4;
				spark(b.x,b.y);
				if(d.hp<=0){
					d.dead=true;
					score+=125;
					explosion(d.x,d.y,26);
				}
				break;
			}
		}
		if(b.hit) continue;
		for(const p of planes){
			if(p.dead) continue;
			if(Math.abs(b.x-p.x)<55 && Math.abs(b.y-p.y)<18){
				b.hit=true;p.hp--;score+=5;
				spark(b.x,b.y);
				if(p.hp<=0){
					p.dead=true;
					p.vy=30;
					score+=100;
					colorExplosion(p.x,p.y,38);
				}
				break;
			}
		}
		if(b.hit) continue;
		for(const t of troopers){
			if(t.remove || t.state==="stack" || t.state==="runner" || t.state==="plant" || t.state==="fuse" || t.state==="abducted") continue;
			if(t.chute && dist2(b.x,b.y,t.x,t.y-25)<19*19){
				b.hit=true;t.chute=false;t.state="fall";t.vy=30;t.vx+=rand(-25,25);score+=10;spark(b.x,b.y);break;
			}
			if(dist2(b.x,b.y,t.x,t.y)<11*11){
				b.hit=true;
				t.chute=false;
				t.dead=true;
				t.state="deadfall";
				t.vy=55;
				t.vx+=rand(-30,30);
				score+=50;
				spark(b.x,b.y);
				break;
			}
		}
	}
	bullets=bullets.filter(b=>!b.hit&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
}

function updateEnemyBullets(dt){
	for(const b of enemyBullets){
		b.x+=b.vx*dt;
		b.y+=b.vy*dt;
		if(dist2(b.x,b.y,W/2,groundY-25)<34*34){
			b.hit=true;
			turretHealth=Math.max(0,turretHealth-6);
			spark(b.x,b.y);
			if(turretHealth<=0)explodeTurret();
		}
	}
	enemyBullets=enemyBullets.filter(b=>!b.hit&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
}

function spark(x,y){for(let i=0;i<5;i++)particles.push({x,y,vx:rand(-70,70),vy:rand(-70,20),t:.35})}
function makeSplat(x){
	splats.push({x,y:groundY-4,t:5});
	for(let i=0;i<18;i++){
		splatterParticles.push({
			x:x+rand(-5,5),
			y:groundY-7,
			vx:rand(-95,95),
			vy:rand(-155,-45),
			r:rand(1.5,3.2),
			t:rand(.45,.9),
			red:true
		});
	}
}
function explosion(x,y,r){explosions.push({x,y,r:3,max:r,t:.45});for(let i=0;i<14;i++)particles.push({x,y,vx:rand(-140,140),vy:rand(-170,80),t:rand(.4,.9)})}
function colorExplosion(x,y,r){
	colorExplosions.push({x,y,r:4,max:r,t:.65});
	for(let i=0;i<24;i++){
		const a=rand(0,Math.PI*2),s=rand(60,190);
		particles.push({
			x,y,
			vx:Math.cos(a)*s,
			vy:Math.sin(a)*s-rand(0,70),
			t:rand(.45,.95),
			hot:true
		});
	}
}
function explodeTurret(){
	if(gameOver)return;
	explosion(W/2,groundY-25,90);turretHealth=0;gameOver=true;
}

function pyramidLayout(){
	const stackers=troopers.filter(t=>t.state==="stack");
	for(let i=0;i<stackers.length;i++){
		const t=stackers[i];
		let remaining=i,row=0;
		while(remaining>row+1){remaining-=row+2;row++;}
		const count=row+2;
		const side=i%2===0?-1:1;
		const slot=Math.floor(i/2);
		const level=Math.floor((Math.sqrt(8*slot+1)-1)/2);
		const pos=slot-level*(level+1)/2;
		t.x=W/2 + side*(56-level*7 + pos*11);
		t.y=groundY-17-level*14;
	}
	const ready=stackers.length>=cfg.pyramidSize && !troopers.some(t=>["runner","plant","fuse"].includes(t.state));
	if(ready){
		const candidate=stackers[stackers.length-1];
		candidate.state="runner";
	}
}

function difficulty(){
	const lvl=1+Math.floor(elapsed/35);
	const factor=1+(lvl-1)*.10*cfg.difficulty;
	return {lvl,factor,maxPlanes:Math.min(10,cfg.startPlanes+Math.floor((lvl-1)*cfg.difficulty*.7))};
}

function spawnPlanes(dt,d){
	planeSpawnTimer-=dt;
	if(planes.filter(p=>!p.remove).length<d.maxPlanes && planeSpawnTimer<=0){
		planes.push(new Plane());
		planeSpawnTimer=rand(.3,1.2);
	}
}

function spawnUFO(dt){
	ufoSpawnTimer-=dt;
	if(ufoSpawnTimer<=0 && ufos.length===0){
		ufos.push(new UFO());
		ufoSpawnTimer=rand(18,34);
	}
}

function spawnDinosaur(dt){
	dinosaurSpawnTimer-=dt;
	if(dinosaurSpawnTimer<=0 && dinosaurs.length===0){
		dinosaurs.push(new Dinosaur());
		dinosaurSpawnTimer=rand(28,50);
	}
}

function reset(){
	score=0;elapsed=0;gameOver=false;turretHealth=100;lastFire=0;planeSpawnTimer=0;ufoSpawnTimer=rand(10,18);dinosaurSpawnTimer=rand(20,36);
	planes=[];ufos=[];dinosaurs=[];bullets=[];enemyBullets=[];troopers=[];particles=[];splatterParticles=[];explosions=[];colorExplosions=[];splats=[];
	makeTrees();
	for(let i=0;i<cfg.startPlanes;i++){const p=new Plane(i%2?1:-1);p.x=rand(0,W);planes.push(p);}
}

function update(dt,now){
	if(!gameOver && !paused){
		elapsed+=dt;
		const d=difficulty(); levelEl.textContent=d.lvl;
		spawnPlanes(dt,d);
		spawnUFO(dt);
		spawnDinosaur(dt);
		for(const p of planes)p.update(dt,d.factor);
		for(const u of ufos)u.update(dt);

		// Safety: an abducted trooper must always belong to an active UFO.
		// If no UFO owns it, release it into a normal fall rather than leaving it suspended.
		for(const t of troopers){
			if(t.state!=="abducted")continue;
			const owned=ufos.some(u=>!u.remove && !u.dead && (u.target===t || u.abductedTrooper===t));
			if(!owned){
				t.state="fall";
				t.chute=false;
				t.vy=Math.max(25,t.vy||0);
				t.vx=t.vx||rand(-18,18);
			}
		}

		for(const dino of dinosaurs)dino.update(dt);
		for(const t of troopers)t.update(dt);
		pyramidLayout();
		updateBullets(dt);
		if(firing||spaceHeld||rightHeld)shoot(now);
		planes=planes.filter(p=>!p.remove);
		ufos=ufos.filter(u=>!u.remove);
		dinosaurs=dinosaurs.filter(d=>!d.remove);
		troopers=troopers.filter(t=>!t.remove);
	}
	for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.t-=dt}
	particles=particles.filter(p=>p.t>0);
	for(const p of splatterParticles){
		p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=310*dt;p.t-=dt;
		if(p.y>groundY-2){p.y=groundY-2;p.vy*=-.18;p.vx*=.72;}
	}
	splatterParticles=splatterParticles.filter(p=>p.t>0);
	for(const e of explosions){e.t-=dt;e.r+=(e.max-e.r)*.23}
	explosions=explosions.filter(e=>e.t>0);
	for(const e of colorExplosions){e.t-=dt;e.r+=(e.max-e.r)*.28}
	colorExplosions=colorExplosions.filter(e=>e.t>0);
	for(const s of splats)s.t-=dt;
	splats=splats.filter(s=>s.t>0);
	scoreEl.textContent=score;
	healthEl.textContent=Math.round(turretHealth);
}

function draw(){
	ctx.clearRect(0,0,W,H);
	ctx.fillStyle="#86c8f2";ctx.fillRect(0,0,W,groundY);
	ctx.fillStyle="#8fcf6b";ctx.fillRect(0,groundY,W,H-groundY);
	ctx.strokeStyle="#333";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(W,groundY);ctx.stroke();
	for(const tr of trees)drawTree(tr.x,groundY,tr.h,tr.w);
	for(const s of splats){ctx.fillStyle="#b31217";ctx.beginPath();ctx.ellipse(s.x,s.y,14,3,0,0,Math.PI*2);ctx.fill();}
	for(const p of planes)p.draw();
	for(const u of ufos)u.draw();
	for(const dino of dinosaurs)dino.draw();
	for(const t of troopers)t.draw();
	drawTurret();
	ctx.fillStyle="#333";
	for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}
	for(const p of splatterParticles){
		ctx.fillStyle=p.red?"#b31217":"#087f75";
		ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
	}
	for(const p of particles){ctx.globalAlpha=clamp(p.t*2,0,1);ctx.fillStyle=p.hot?(p.t>.55?"#ff5a00":"#d7191c"):"#333";ctx.fillRect(p.x,p.y,p.hot?4:3,p.hot?4:3);ctx.globalAlpha=1}
	for(const e of explosions){
		ctx.save();ctx.globalAlpha=clamp(e.t*2.3,0,1);ctx.strokeStyle="#333";ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
		for(let i=0;i<10;i++){const a=i*Math.PI*2/10;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*e.r*.7,e.y+Math.sin(a)*e.r*.7);ctx.lineTo(e.x+Math.cos(a)*e.r*1.25,e.y+Math.sin(a)*e.r*1.25);ctx.stroke()}
		ctx.restore();
	}
	for(const e of colorExplosions){
		ctx.save();
		ctx.globalAlpha=clamp(e.t*1.7,0,1);
		ctx.fillStyle="#ff7a00";
		ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
		ctx.fillStyle="#d7191c";
		ctx.beginPath();ctx.arc(e.x,e.y,e.r*.62,0,Math.PI*2);ctx.fill();
		ctx.fillStyle="#ffb000";
		ctx.beginPath();ctx.arc(e.x,e.y,e.r*.28,0,Math.PI*2);ctx.fill();
		ctx.restore();
	}
	if(paused && !gameOver){
		ctx.fillStyle="rgba(255,255,255,.72)";ctx.fillRect(0,0,W,H);
		ctx.fillStyle="#222";ctx.textAlign="center";ctx.font="700 54px Arial";ctx.fillText("PAUSED",W/2,H/2);
	}
	if(gameOver){
		ctx.fillStyle="rgba(255,255,255,.78)";ctx.fillRect(0,0,W,H);
		ctx.fillStyle="#222";ctx.textAlign="center";ctx.font="700 58px Arial";ctx.fillText("TURRET DESTROYED",W/2,H/2-20);
		ctx.font="28px Arial";ctx.fillText("Score: "+score,W/2,H/2+28);
		ctx.font="20px Arial";ctx.fillText("Press Restart to play again",W/2,H/2+68);
	}
}

function drawTree(x,y,h=50,w=28){
	ctx.save();
	ctx.strokeStyle="#6b3f22";
	ctx.fillStyle="#7a4a28";
	ctx.lineWidth=2;
	ctx.fillRect(x-4,y-h*.48,8,h*.48);
	ctx.strokeRect(x-4,y-h*.48,8,h*.48);

	ctx.fillStyle="#2f8f3a";
	ctx.strokeStyle="#1f5f29";
	ctx.beginPath();
	ctx.arc(x,y-h*.72,w*.62,0,Math.PI*2);
	ctx.arc(x-w*.42,y-h*.60,w*.48,0,Math.PI*2);
	ctx.arc(x+w*.42,y-h*.60,w*.48,0,Math.PI*2);
	ctx.arc(x,y-h*.92,w*.48,0,Math.PI*2);
	ctx.fill();
	ctx.stroke();
	ctx.restore();
}

canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("mousedown",e=>{
	if(e.button===2){rightHeld=true;e.preventDefault()}
	if(e.button===0){firing=true;shoot(performance.now())}
});
addEventListener("mouseup",e=>{if(e.button===2)rightHeld=false;if(e.button===0)firing=false});
addEventListener("keydown",e=>{if(e.code==="Space"){spaceHeld=true;e.preventDefault()}});
addEventListener("keyup",e=>{if(e.code==="Space"){spaceHeld=false;e.preventDefault()}});

document.getElementById("pauseBtn").onclick=()=>{
	paused=!paused;
	document.getElementById("pauseBtn").textContent=paused?"Resume":"Pause";
};
document.getElementById("restartBtn").onclick=()=>{
	paused=false;
	document.getElementById("pauseBtn").textContent="Pause";
	reset();
};
document.getElementById("settingsBtn").onclick=()=>settings.showModal();
document.getElementById("closeSettings").onclick=()=>settings.close();

const binds=[
	["fire","fireOut","fireInterval",v=>v+" ms"],
	["drop","dropOut","dropInterval",v=>v+" ms"],
	["planes","planesOut","startPlanes",v=>v],
	["hp","hpOut","planeHP",v=>v],
	["ufoHp","ufoHpOut","ufoHP",v=>v],
	["pyr","pyrOut","pyramidSize",v=>v],
	["diff","diffOut","difficulty",v=>Number(v).toFixed(1)+"×"]
];
for(const [id,out,key,fmt] of binds){
	const el=document.getElementById(id),o=document.getElementById(out);
	el.value=cfg[key];o.textContent=fmt(el.value);
	el.oninput=()=>{cfg[key]=Number(el.value);o.textContent=fmt(el.value)};
}

let last=performance.now();
function loop(now){
	const dt=Math.min(.033,(now-last)/1000);last=now;
	update(dt,now);draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
